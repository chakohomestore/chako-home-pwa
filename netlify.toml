# Netlify ayarları: build gerekmez, klasör olduğu gibi yayınlanır.
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/products.json"
  [headers.values]
    Cache-Control = "no-cache"

# chakohome.xyz adresine gelenleri ana adrese (chakohome.com.tr) kalıcı yönlendir
[[redirects]]
  from = "https://chakohome.xyz/*"
  to = "https://chakohome.com.tr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://chakohome.xyz/*"
  to = "https://chakohome.com.tr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.chakohome.xyz/*"
  to = "https://chakohome.com.tr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.chakohome.xyz/*"
  to = "https://chakohome.com.tr/:splat"
  status = 301
  force = true
